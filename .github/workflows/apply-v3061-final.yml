name: Aplicar versão final 3.0.6.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstituir e verificar a atualização
        shell: bash
        run: |
          cat .update/v3061-source.patch.* > /tmp/v3061-source.patch
          echo "5401abc0cb4c9f2db0675378b7c2254dc3b19594eea62e630571f421c2fd90cc  /tmp/v3061-source.patch" | sha256sum -c -
          patch --dry-run -p1 < /tmp/v3061-source.patch

      - name: Aplicar código final e logótipos oficiais
        shell: bash
        run: |
          patch -p1 < /tmp/v3061-source.patch
          mkdir -p public/branding
          cp site/assets/ccvne-logo.svg public/branding/ccvne-logo.svg
          cp site/assets/aeas-logo.svg public/branding/aeas-logo.svg
          cp site/assets/prr-nextgen-logo.svg public/branding/prr-nextgen-logo.svg
          rm -f site/.keep

      - name: Verificar a versão completa
        shell: bash
        run: |
          grep -q '^Ciência em Movimento 3.0.6.1$' VERSAO.txt
          grep -q '"version": "3.0.6"' package.json
          grep -q 'Duelo Gravitacional' site/index.html
          grep -q 'releases/latest' site/site.js
          grep -q 'difficultyRects' src/experiences/gravitational-duel/GravitationalDuelExperience.ts
          grep -q 'setPoseEnabled(true)' src/App.ts
          test -s site/assets/ccvne-logo.svg
          test -s site/assets/aeas-logo.svg
          test -s site/assets/prr-nextgen-logo.svg
          test -s public/branding/ccvne-logo.svg
          test -s public/branding/aeas-logo.svg
          test -s public/branding/prr-nextgen-logo.svg
          test -s docs/RELEASE_V3.0.6.1.md

      - name: Remover infraestrutura temporária e publicar
        shell: bash
        run: |
          rm -rf .update
          rm -f .github/workflows/apply-v3061-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar versão 3.0.6.1 e nova página de divulgação"
          git push origin HEAD:main
