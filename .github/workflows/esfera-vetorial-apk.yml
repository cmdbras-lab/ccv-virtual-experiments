name: Build Esfera Vetorial APK

on:
  push:
    branches:
      - esfera-vetorial-build
      - main
    paths:
      - 'apps/esfera-vetorial/android/**'
      - '.github/workflows/esfera-vetorial-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply compatibility patch when present
        if: ${{ hashFiles('apps/esfera-vetorial/android/patch_v021.py') != '' }}
        working-directory: apps/esfera-vetorial/android
        run: python3 patch_v021.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare legacy test signing key when present
        if: ${{ hashFiles('apps/esfera-vetorial/android/test-signing.keystore.b64') != '' }}
        working-directory: apps/esfera-vetorial/android
        run: base64 -d test-signing.keystore.b64 > test-signing.keystore

      - name: Build debug APK
        working-directory: apps/esfera-vetorial/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EsferaVetorial-v0.2.2-debug-apk
          path: apps/esfera-vetorial/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK in repository
        run: |
          mkdir -p apps/esfera-vetorial/downloads
          cp apps/esfera-vetorial/android/app/build/outputs/apk/debug/app-debug.apk apps/esfera-vetorial/downloads/EsferaVetorial-v0.2.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/esfera-vetorial/downloads/EsferaVetorial-v0.2.2.apk
          git commit -m "Publicar APK Esfera Vetorial v0.2.2" || true
          git push || true

      - name: Normalize public source after prototype patch
        if: ${{ hashFiles('apps/esfera-vetorial/android/patch_v021.py') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/esfera-vetorial/android/app/build.gradle')
          text = p.read_text(encoding='utf-8')
          start = text.find('    signingConfigs {')
          end = text.find('    buildTypes {')
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          text = text.replace("        debug {\n            signingConfig signingConfigs.debug\n        }\n", "")
          p.write_text(text, encoding='utf-8')
          PY
          rm -f apps/esfera-vetorial/android/patch_v021.py
          rm -f apps/esfera-vetorial/android/test-signing.keystore.b64
          rm -rf apps/esfera-vetorial/source-b64
          rm -f apps/esfera-vetorial/EsferaVetorial-v0.1.0.zip
          git add -A apps/esfera-vetorial/android apps/esfera-vetorial/source-b64 apps/esfera-vetorial/EsferaVetorial-v0.1.0.zip || true
          git commit -m "Integrar v0.2.2 diretamente no código-fonte público" || true
          git push || true
