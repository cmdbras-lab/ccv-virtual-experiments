name: Build Esfera Vetorial APK

on:
  push:
    branches:
      - esfera-vetorial-build
    paths:
      - 'apps/esfera-vetorial/android/**'
      - '.github/workflows/esfera-vetorial-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare persistent test signing key
        working-directory: apps/esfera-vetorial/android
        run: base64 -d test-signing.keystore.b64 > test-signing.keystore

      - name: Build debug APK
        working-directory: apps/esfera-vetorial/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EsferaVetorial-v0.1.3-debug-apk
          path: apps/esfera-vetorial/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
