name: Build Esfera Vetorial APK

on:
  push:
    branches:
      - esfera-vetorial-build
    paths:
      - 'apps/esfera-vetorial/**'
      - '.github/workflows/esfera-vetorial-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract Esfera Vetorial source
        run: |
          rm -rf apps/esfera-vetorial/build-src
          mkdir -p apps/esfera-vetorial/build-src
          unzip -q apps/esfera-vetorial/EsferaVetorial-v0.1.0.zip -d apps/esfera-vetorial/build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: apps/esfera-vetorial/build-src/EsferaVetorial
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EsferaVetorial-v0.1.0-debug-apk
          path: apps/esfera-vetorial/build-src/EsferaVetorial/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
