name: Diagnosticar atualização 3.0.6.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.6.1-site
          fetch-depth: 0

      - name: Diagnosticar reconstrução
        run: |
          python - <<'PY'
          import base64, glob, gzip, hashlib, re
          raw_parts = []
          for path in sorted(glob.glob('.update/bundle.*')):
              raw_parts.append(open(path, encoding='utf-8').read())
          raw = ''.join(raw_parts)
          encoded = ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))
          payload = base64.b64decode(encoded)
          lines = [
              f'raw_chars={len(raw)}',
              f'encoded_chars={len(encoded)}',
              f'payload_bytes={len(payload)}',
              f'payload_sha256={hashlib.sha256(payload).hexdigest()}',
              'expected_sha256=ebc4e0e28824c53c6dc55754a7f085db81621c53873367bd0233df039499ef83',
          ]
          try:
              data = gzip.decompress(payload)
              lines.append('gzip=ok')
              lines.append(f'uncompressed_bytes={len(data)}')
              lines.append(f'uncompressed_sha256={hashlib.sha256(data).hexdigest()}')
          except Exception as exc:
              lines.append(f'gzip=error:{type(exc).__name__}:{exc}')
          open('.update/reconstruction.txt', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY

      - name: Guardar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .update/reconstruction.txt
          git commit -m "Registar diagnóstico da reconstrução"
          git push origin HEAD:release/v3.0.6.1-site
