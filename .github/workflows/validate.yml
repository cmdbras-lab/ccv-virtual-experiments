name: Validar e empacotar projeto

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar registo npm público
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set replace-registry-host always

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Preparar recursos e fonte do duelo
        run: npm run setup

      - name: Compilar e verificar tipos
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-check.log

      - name: Guardar diagnóstico de compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-typescript
          path: ci-check.log
          if-no-files-found: error

      - name: Interromper após erro de compilação
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Teste estrutural
        run: npm run test:smoke

      - name: Validar pacote executável
        run: node scripts/validate-runtime.mjs

      - name: Criar pacotes da versão 3.0.0
        run: |
          rm -rf release /tmp/ciencia-em-movimento-full
          mkdir -p release/execution /tmp/ciencia-em-movimento-full
          cp -R dist scripts release/execution/
          cp EXECUTAR_WINDOWS.bat EXECUTAR_DEMO_WINDOWS.bat INSTALAR_WINDOWS.bat README.md release/execution/
          (cd release/execution && zip -qr ../ciencia-em-movimento-v3.0.0-execucao.zip .)
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='release' ./ /tmp/ciencia-em-movimento-full/
          (cd /tmp/ciencia-em-movimento-full && zip -qr "$GITHUB_WORKSPACE/release/ciencia-em-movimento-v3.0.0-completo.zip" .)
          rm -rf release/execution
          (cd release && sha256sum *.zip > ciencia-em-movimento-v3.0.0-SHA256.txt)

      - name: Guardar versão compilada
        uses: actions/upload-artifact@v4
        with:
          name: ciencia-em-movimento-v3.0.0-dist
          path: dist/
          if-no-files-found: error

      - name: Guardar pacotes completos
        uses: actions/upload-artifact@v4
        with:
          name: ciencia-em-movimento-v3.0.0-pacotes
          path: release/
          if-no-files-found: error
