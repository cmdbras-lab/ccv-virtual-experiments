plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.esferavetorial.app'
    compileSdk 36

    defaultConfig {
        applicationId 'pt.esferavetorial.app'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.3'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('test-signing.keystore')
            storePassword 'esferavetorial-test'
            keyAlias 'esferavetorial'
            keyPassword 'esferavetorial-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
